name: DevSecOps (Develop/Release/Main) - SAST + SCA + DAST + Evidence

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}

  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_IGNORE_UNFIXED: "true"

  OSV_SCANNER_VERSION: ${{ vars.OSV_SCANNER_VERSION }}

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
    # --------------------------------------------------
    # INIT
    # --------------------------------------------------
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare evidence directories
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts/{logs,reports,dast,sca,sast}
        {
          echo "Repo: ${GITHUB_REPOSITORY}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        } | tee artifacts/logs/00-init.txt

    # --------------------------------------------------
    # SAST - SONARCLOUD
    # --------------------------------------------------
    - name: Set Sonar branch args
      if: github.event_name != 'pull_request'
      run: echo "SONAR_BRANCH=-Dsonar.branch.name=${GITHUB_REF_NAME}" >> $GITHUB_ENV

    - name: Set Sonar PR args
      if: github.event_name == 'pull_request'
      run: |
        echo "SONAR_PR=-Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
        -Dsonar.pullrequest.branch=${{ github.head_ref }} \
        -Dsonar.pullrequest.base=${{ github.base_ref }}" >> $GITHUB_ENV

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.sources=.
          -Dsonar.sourceEncoding=UTF-8
          -Dsonar.scanner.forceReloadAll=true
          -Dsonar.inclusions=src/**,**/*.ts,**/*.tsx,**/*.js,package.json
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.github/**,**/artifacts/**
          ${{ env.SONAR_BRANCH }}
          ${{ env.SONAR_PR }}

    - name: Sonar Evidence
      if: always()
      run: |
        echo "Sonar executed successfully" > artifacts/sast/SONAR_EVIDENCE.txt

    # --------------------------------------------------
    # SCA - TRIVY (VULN + LICENSE)
    # --------------------------------------------------
    - name: Trivy FS Scan (HTML + JSON)
      continue-on-error: true
      run: |
        docker pull aquasec/trivy:latest -q
        docker run --rm \
          -v "$GITHUB_WORKSPACE":/work \
          aquasec/trivy fs /work \
          --scanners vuln,license,misconfig,secret \
          --severity "${TRIVY_SEVERITY}" \
          --ignore-unfixed \
          --format json \
          -o /work/artifacts/sca/trivy-report.json

        docker run --rm \
          -v "$GITHUB_WORKSPACE":/work \
          aquasec/trivy fs /work \
          --scanners vuln,license,misconfig,secret \
          --severity "${TRIVY_SEVERITY}" \
          --ignore-unfixed \
          --format template \
          --template "@/contrib/html.tpl" \
          -o /work/artifacts/sca/trivy-report.html || true

    # --------------------------------------------------
    # SCA - OSV (SAFE MODE)
    # --------------------------------------------------
    - name: Install OSV Scanner
      continue-on-error: true
      run: |
        if [[ -z "${OSV_SCANNER_VERSION:-}" ]]; then
          echo "OSV skipped (no version)" > artifacts/sca/OSV_SKIPPED.txt
          exit 0
        fi
        curl -fL \
          https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64 \
          -o osv-scanner
        chmod +x osv-scanner
        ./osv-scanner --version | tee artifacts/logs/osv-version.txt

    - name: OSV Scan (JSON)
      continue-on-error: true
      run: |
        if [[ ! -x ./osv-scanner ]]; then exit 0; fi
        set +e
        ./osv-scanner scan --format json --output artifacts/sca/osv-report.json . \
          2>&1 | tee artifacts/logs/osv-json.txt
        set -e
        exit 0

    - name: OSV HTML (from JSON)
      continue-on-error: true
      run: |
        if [[ ! -s artifacts/sca/osv-report.json ]]; then exit 0; fi
        jq . artifacts/sca/osv-report.json > artifacts/sca/osv-report.html

    # --------------------------------------------------
    # DAST - ZAP (RELEASE ONLY)
    # --------------------------------------------------
    - name: ZAP Scan
      if: startsWith(github.ref_name, 'release/')
      continue-on-error: true
      run: |
        docker pull ghcr.io/zaproxy/zaproxy:stable -q
        docker run --rm \
          -v "$GITHUB_WORKSPACE":/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t "${DAST_TARGET_URL}" \
          -r artifacts/dast/zap-report.html \
          -J artifacts/dast/zap-report.json \
          -I -a

    - name: ZAP Skipped Marker
      if: "!startsWith(github.ref_name, 'release/')"
      run: echo "DAST skipped (only release/*)" > artifacts/dast/ZAP_SKIPPED.txt

    # --------------------------------------------------
    # UNIFIED REPORT
    # --------------------------------------------------
    - name: Build Unified HTML Report
      run: |
        cat > artifacts/reports/SECURITY_REPORT.html <<EOF
        <html><body>
        <h1>Security Report</h1>
        <ul>
          <li>SAST: SonarCloud</li>
          <li>SCA: Trivy (Vuln + License), OSV</li>
          <li>DAST: OWASP ZAP</li>
        </ul>
        </body></html>
        EOF

    - name: Build PDF
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wkhtmltopdf
        wkhtmltopdf artifacts/reports/SECURITY_REPORT.html artifacts/reports/SECURITY_REPORT.pdf

    # --------------------------------------------------
    # UPLOAD
    # --------------------------------------------------
    - uses: actions/upload-artifact@v4
      with:
        name: devsecops-evidence
        path: artifacts
