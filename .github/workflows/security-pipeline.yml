name: Security Pipeline (SAST/DAST/SCA/Secrets) - JWT

on:
  push:
    branches:
      - security/github-actions-sast-dast
  pull_request:
    branches:
      - security/github-actions-sast-dast
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_codeql:
    name: SAST - CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # IMPORTANT:
      # Em repositórios privados/organizacionais, Code Scanning pode não estar habilitado.
      # Para não quebrar o pipeline, fazemos upload=false e geramos SARIF como artifact.
      - name: Analyze (no upload)
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: results
          category: "/language:${{ matrix.language }}"

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: results/**/*.sarif

      # Se Code Scanning estiver habilitado, você pode trocar upload:false para true
      # OU adicionar um step upload-sarif apontando para results/**/*.sarif

  sca_dependency_review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review (license policy)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  sca_sbom:
    name: SCA - SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (auto)
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm -v
            pnpm i --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn -v
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p reports
          npm i -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file reports/sbom-cyclonedx.json --json
          cyclonedx-npm --output-file reports/sbom-cyclonedx.xml --output-format xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: reports/sbom-cyclonedx.*

  secrets_gitleaks:
    name: Secrets - Gitleaks (container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks -> SARIF
        run: |
          set -euo pipefail
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" -w /repo gitleaks/gitleaks:latest \
            detect --source . --no-git \
            --report-format sarif --report-path reports/gitleaks.sarif --redact

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.sarif

      # Se seu GitHub Security aceitar SARIF, isso adiciona na aba Security.
      # Caso não esteja habilitado, comente este step.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

  dast_zap_jwt:
    name: DAST - OWASP ZAP (JWT Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}
      DAST_LOGIN_URL: ${{ vars.DAST_LOGIN_URL }}
      DAST_LOGIN_BODY: ${{ vars.DAST_LOGIN_BODY }}
      DAST_TOKEN_FIELD: ${{ vars.DAST_TOKEN_FIELD }}
      DAST_USERNAME: ${{ secrets.DAST_USERNAME }}
      DAST_PASSWORD: ${{ secrets.DAST_PASSWORD }}

    steps:
      - name: Guard - ensure required vars/secrets are set
        run: |
          set -euo pipefail
          for v in DAST_TARGET_URL DAST_LOGIN_URL DAST_LOGIN_BODY DAST_TOKEN_FIELD; do
            if [ -z "${!v:-}" ]; then
              echo "$v is not set. Configure it in Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          done
          for s in DAST_USERNAME DAST_PASSWORD; do
            if [ -z "${!s:-}" ]; then
              echo "$s secret is not set. Configure it in Settings -> Secrets and variables -> Actions -> Secrets."
              exit 1
            fi
          done

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Get JWT token (Medusa Admin)
        id: jwt
        run: |
          set -euo pipefail
          mkdir -p reports

          BODY='${DAST_LOGIN_BODY}'
          BODY="${BODY/__USER__/${DAST_USERNAME}}"
          BODY="${BODY/__PASS__/${DAST_PASSWORD}}"

          RESPONSE=$(curl -sS -X POST "${DAST_LOGIN_URL}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          TOKEN=$(echo "$RESPONSE" | jq -r ".${DAST_TOKEN_FIELD}")

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain JWT token"
            echo "$RESPONSE" > reports/login-response.json
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run ZAP Baseline Scan (inject Bearer)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          cmd_options: >
            -a
            -I
            -m 5
            -r zap-report.html
            -w zap-report.md
            -J zap-report.json
            -z "-config replacer.full_list(0).description=authbearer
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=Authorization
                -config replacer.full_list(0).regex=false
                -config replacer.full_list(0).replacement=Bearer ${{ steps.jwt.outputs.token }}"

      - name: Move ZAP reports to reports/
        run: |
          mkdir -p reports
          mv zap-report.html reports/ || true
          mv zap-report.md reports/ || true
          mv zap-report.json reports/ || true

      - name: Upload ZAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: reports/zap-report.*

      - name: Upload login response (debug on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zap-login-debug
          path: reports/login-response.json

  unify_reports:
    name: Reports - Consolidate & Index
    runs-on: ubuntu-latest
    needs:
      - sast_codeql
      - sca_sbom
      - secrets_gitleaks
      - dast_zap_jwt
    if: always()
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts

      - name: Build consolidated index
        run: |
          mkdir -p reports
          {
            echo "# Security Pipeline Reports"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "## Artifacts"
            echo ""
            find collected-artifacts -type f | sort | sed 's|^collected-artifacts/|- |'
            echo ""
            echo "## Notes"
            echo "- CodeQL SARIF is saved as artifact (codeql-sarif). If Code Scanning is enabled, you can also upload it to GitHub Security."
            echo "- Gitleaks SARIF is saved as artifact (gitleaks-report) and uploaded to GitHub Security (if enabled)."
            echo "- ZAP reports are saved as HTML/MD/JSON (zap-dast-report)."
            echo "- SBOM is saved as CycloneDX JSON/XML (sbom-cyclonedx)."
          } > reports/INDEX.md

      - name: Upload consolidated index
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-index
          path: reports/INDEX.md
