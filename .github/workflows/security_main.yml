name: DevSecOps - Sonar Scan + OWASP ZAP (DAST) + GitHub Dependency Review (SCA)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs artifacts/reports artifacts/dast artifacts/sca
          echo "✅ Evidence directories created." | tee artifacts/logs/00-init.txt

      - name: Context log
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Context ==="
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "SHA: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_NUMBER} Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "DAST_TARGET_URL: ${DAST_TARGET_URL}"
            echo "==============="
          } | tee artifacts/logs/01-context.txt

      # =========================================================
      # SAST - Sonar (ONLY what Sonar provided)
      # =========================================================
      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
           args: >
              -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
              -Dsonar.organization=${{ vars.SONAR_ORG }}

      - name: Setup Node (Corepack + Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install deps (yarn) - NON-BLOCKING
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version | tee artifacts/logs/10-yarn-version.txt

          if [ -f yarn.lock ]; then
            if yarn --version | grep -Eq '^1\.'; then
              yarn install --frozen-lockfile 2>&1 | tee artifacts/logs/10-install.txt
            else
              yarn install --immutable 2>&1 | tee artifacts/logs/10-install.txt
            fi
          else
            echo "⚠️ yarn.lock not found. This project should commit yarn.lock for reproducible builds." \
              | tee artifacts/logs/10-install.txt
            yarn install 2>&1 | tee -a artifacts/logs/10-install.txt
          fi

      # =========================================================
      # SCA - GitHub Dependency Review (PR only)
      # =========================================================
      - name: SCA - GitHub Dependency Review (PR) - NON-BLOCKING
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

      - name: SCA - Export dependency graph diff (JSON) - PR only
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          OUT="artifacts/sca/dependency-graph-compare.json"

          curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST "https://api.github.com/repos/${REPO}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | tee "$OUT" >/dev/null || true

          if [[ ! -s "$OUT" ]]; then
            echo "Dependency graph compare JSON could not be exported. See PR check output." \
              > artifacts/sca/EXPORT_FAILED.txt
          else
            echo "✅ Exported SCA JSON to $OUT" | tee artifacts/logs/20-sca-export.txt
          fi

      # =========================================================
      # DAST - OWASP ZAP (Docker)
      # =========================================================
      - name: DAST - OWASP ZAP Baseline (docker) - NON-BLOCKING
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R a+rwx "$GITHUB_WORKSPACE" || true
          docker pull ghcr.io/zaproxy/zaproxy:stable -q
          timeout 600 docker run --rm \
            -v "$GITHUB_WORKSPACE":/zap/wrk:rw \
            --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${DAST_TARGET_URL}" \
              -J /zap/wrk/artifacts/dast/zap-report.json \
              -w /zap/wrk/artifacts/dast/zap-report.md \
              -r /zap/wrk/artifacts/dast/zap-report.html \
              -a -I -m 5 \
            2>&1 | tee artifacts/logs/31-zap-run.txt || true

      - name: DAST - Validate reports + placeholder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s artifacts/dast/zap-report.html && ! -s artifacts/dast/zap-report.json && ! -s artifacts/dast/zap-report.md ]]; then
            echo "ZAP did not generate reports. Check workflow logs." > artifacts/dast/ZAP_EMPTY.txt
          fi

      # =========================================================
      # PDF report (DAST + SCA) - FREE
      # =========================================================
      - name: Build DAST+SCA PDF report (FREE)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y pandoc wkhtmltopdf

          REPORT_MD="artifacts/reports/DAST_SCA_REPORT.md"
          REPORT_PDF="artifacts/reports/DAST_SCA_REPORT.pdf"

          {
            echo "# Relatório Técnico - DAST + SCA"
            echo ""
            echo "## Contexto"
            echo "- Repositório: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- CI Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## DAST (OWASP ZAP)"
            echo "- Target: ${DAST_TARGET_URL}"
            echo "- Evidências:"
            echo "  - artifacts/dast/zap-report.html"
            echo "  - artifacts/dast/zap-report.md"
            echo "  - artifacts/dast/zap-report.json"
            echo ""
            if [[ -s artifacts/dast/zap-report.md ]]; then
              echo "### Saída ZAP (markdown)"
              echo ""
              # inclui um trecho para o PDF não ficar gigantesco
              sed -n '1,200p' artifacts/dast/zap-report.md
              echo ""
              echo "> (Relatório completo nos artifacts: zap-report.html/md/json)"
            else
              echo "> ZAP report não encontrado. Verifique artifacts/dast/ e logs."
            fi
            echo ""
            echo "## SCA (GitHub Dependency Review)"
            echo "- Executa apenas em Pull Request."
            echo "- Evidências:"
            echo "  - artifacts/sca/dependency-graph-compare.json (se PR)"
            echo "  - artifacts/sca/EXPORT_FAILED.txt (se falhou)"
            echo ""
            if [[ -s artifacts/sca/dependency-graph-compare.json ]]; then
              echo "### JSON (trecho)"
              echo ""
              echo '```json'
              head -c 6000 artifacts/sca/dependency-graph-compare.json || true
              echo ""
              echo '```'
              echo ""
              echo "> (JSON completo anexado em artifacts/sca/)"
            else
              echo "> Sem JSON de SCA nesta execução (provavelmente não foi PR)."
            fi
          } > "$REPORT_MD"

          pandoc "$REPORT_MD" -o "$REPORT_PDF" --pdf-engine=wkhtmltopdf

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-evidence
          path: artifacts

      - name: Job Summary (quick links)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Evidências geradas"
            echo ""
            echo "- **PDF (DAST+SCA):** artifacts/reports/DAST_SCA_REPORT.pdf"
            echo "- **DAST:** artifacts/dast/zap-report.*"
            echo "- **SCA (PR only):** artifacts/sca/dependency-graph-compare.json"
            echo "- **Logs:** artifacts/logs/"
            echo ""
            echo "> Baixe o artifact **devsecops-evidence**."
          } >> "$GITHUB_STEP_SUMMARY"
