name: DevSecOps (MAIN) - Sonar + ZAP (DAST) + SCA + PDF   

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: devsecops-main-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs artifacts/reports artifacts/dast artifacts/sca
          echo "✅ Evidence directories created." | tee artifacts/logs/00-init.txt

      - name: Context log
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== Context ==="
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "SHA: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_NUMBER} Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "DAST_TARGET_URL: ${DAST_TARGET_URL}"
            echo "==============="
          } | tee artifacts/logs/01-context.txt

      # -------------------------
      # SAST (Sonar) - baseline main
      # -------------------------
      - name: Sonar Scan (main)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.branch.name=main
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.github/**
            -Dsonar.sourceEncoding=UTF-8

      # -------------------------
      # DAST - OWASP ZAP (Docker)
      # -------------------------
      - name: DAST - OWASP ZAP Baseline (docker) - NON-BLOCKING
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R a+rwx "$GITHUB_WORKSPACE" || true
          docker pull ghcr.io/zaproxy/zaproxy:stable -q
          timeout 600 docker run --rm \
            -v "$GITHUB_WORKSPACE":/zap/wrk:rw \
            --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${DAST_TARGET_URL}" \
              -J /zap/wrk/artifacts/dast/zap-report.json \
              -w /zap/wrk/artifacts/dast/zap-report.md \
              -r /zap/wrk/artifacts/dast/zap-report.html \
              -a -I -m 5 \
            2>&1 | tee artifacts/logs/31-zap-run.txt || true

      - name: DAST - Validate reports + placeholder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s artifacts/dast/zap-report.html && ! -s artifacts/dast/zap-report.json && ! -s artifacts/dast/zap-report.md ]]; then
            echo "ZAP did not generate reports. Check workflow logs." > artifacts/dast/ZAP_EMPTY.txt
          fi

      # -------------------------
      # SCA (Main) - gratuito (yarn audit) para ter evidência também fora de PR
      # -------------------------
      - name: Setup Node (Corepack + Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install deps (yarn) - NON-BLOCKING
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if yarn --version | grep -Eq '^1\.'; then
            yarn install --frozen-lockfile || true
          else
            yarn install --immutable || true
          fi

      - name: SCA - yarn audit (JSON) - NON-BLOCKING
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          yarn audit --json > artifacts/sca/yarn-audit.json || true

      # -------------------------
      # PDF (DAST + SCA)
      # -------------------------
      - name: Build DAST+SCA PDF report (FREE)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y pandoc wkhtmltopdf

          REPORT_MD="artifacts/reports/DAST_SCA_REPORT.md"
          REPORT_PDF="artifacts/reports/DAST_SCA_REPORT.pdf"

          {
            echo "# Relatório Técnico - DAST + SCA (MAIN)"
            echo ""
            echo "## Contexto"
            echo "- Repositório: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- CI Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## DAST (OWASP ZAP)"
            echo "- Target: ${DAST_TARGET_URL}"
            echo "- Evidências:"
            echo "  - artifacts/dast/zap-report.html"
            echo "  - artifacts/dast/zap-report.md"
            echo "  - artifacts/dast/zap-report.json"
            echo ""
            if [[ -s artifacts/dast/zap-report.md ]]; then
              echo "### Saída ZAP (trecho)"
              echo ""
              sed -n '1,200p' artifacts/dast/zap-report.md
              echo ""
              echo "> (Relatório completo nos artifacts)"
            else
              echo "> ZAP report não encontrado."
            fi
            echo ""
            echo "## SCA (yarn audit - JSON)"
            echo "- Evidência: artifacts/sca/yarn-audit.json"
            echo ""
            if [[ -s artifacts/sca/yarn-audit.json ]]; then
              echo "### yarn audit (trecho)"
              echo ""
              echo '```json'
              head -c 6000 artifacts/sca/yarn-audit.json || true
              echo ""
              echo '```'
            else
              echo "> yarn-audit.json não gerado."
            fi
          } > "$REPORT_MD"

          pandoc "$REPORT_MD" -o "$REPORT_PDF" --pdf-engine=wkhtmltopdf

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-evidence-main
          path: artifacts
